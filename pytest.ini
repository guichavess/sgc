[pytest]
# Diretório raiz dos testes
testpaths = tests

# Padrão de descoberta de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts =
    -v
    --tb=short
    --strict-markers

# Marcadores customizados
markers =
    bug: marca testes que verificam bugs conhecidos (use: pytest -m bug)
    perf: marca testes de performance
    integration: marca testes de integração (requerem banco real)
    unit: marca testes unitários puros

# Variável de ambiente de testes
env =
    FLASK_ENV=testing
