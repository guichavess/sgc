{# Campos compartilhados pelos modais de Cadastrar/Editar Saldo do Fundo Rotativo.
   Variáveis esperadas: prefix (string única para ids), saldo (FundoRotativoSaldo ou None),
   fontes (list[ClassFonte]), exercicios (list[(id, titulo)]). #}
<div class="mb-3">
    <label for="valor_{{ prefix }}" class="form-label fw-semibold">Valor (R$) <span class="text-danger">*</span></label>
    <input type="text" inputmode="decimal" class="form-control mask-money"
           id="valor_{{ prefix }}" name="valor" required
           value="{{ ('%.2f'|format(saldo.valor)).replace('.', ',') if saldo else '' }}"
           placeholder="0,00">
</div>
<div class="mb-3">
    <label for="data_{{ prefix }}" class="form-label fw-semibold">Data <span class="text-danger">*</span></label>
    <input type="datetime-local" class="form-control"
           id="data_{{ prefix }}" name="data" required
           value="{{ saldo.data.strftime('%Y-%m-%dT%H:%M') if saldo and saldo.data else '' }}">
</div>
<div class="mb-3">
    <label for="fonte_{{ prefix }}" class="form-label fw-semibold">Fonte <span class="text-danger">*</span></label>
    <select class="form-select" id="fonte_{{ prefix }}" name="fonte_codigo" required>
        <option value="">Selecione uma fonte...</option>
        {% for f in fontes %}
        <option value="{{ f.codigo }}"
                {% if saldo and saldo.fonte_codigo == f.codigo %}selected{% endif %}>
            {{ f.codigo }} - {{ f.descricao }}
        </option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <label for="exercicio_{{ prefix }}" class="form-label fw-semibold">Exercício <span class="text-danger">*</span></label>
    <select class="form-select" id="exercicio_{{ prefix }}" name="id_exercicio" required>
        <option value="">Selecione um exercício...</option>
        {% for eid, titulo in exercicios %}
        <option value="{{ eid }}"
                {% if saldo and saldo.id_exercicio == eid %}selected{% endif %}>
            {{ eid }} - {{ titulo }}
        </option>
        {% endfor %}
    </select>
</div>
