{% extends "base_layout.html" %}

{% block title %}SGC - Gestão de Contratos{% endblock %}
{% block module_name %}Pagamentos{% endblock %}

{% block sidebar_links %}
<div class="sidebar-section-label">Pagamentos</div>
<ul class="sidebar-menu">
    <li>
        <a class="sidebar-link {{ 'active' if request.endpoint == 'solicitacoes.dashboard' }}"
           href="{{ url_for('solicitacoes.dashboard') }}">
            <i class="bi bi-list-check"></i> Solicitações
        </a>
    </li>
    <li>
        <a class="sidebar-link {{ 'active' if request.endpoint == 'solicitacoes.painel' }}"
           href="{{ url_for('solicitacoes.painel') }}">
            <i class="bi bi-bar-chart-fill"></i> Painel
        </a>
    </li>
    <li>
        <a class="sidebar-link {{ 'active' if (request.endpoint or '').startswith('solicitacoes.relatorios') }}"
           href="{{ url_for('solicitacoes.relatorios') }}">
            <i class="bi bi-file-earmark-text"></i> Relatórios
        </a>
    </li>
</ul>
{% endblock %}
